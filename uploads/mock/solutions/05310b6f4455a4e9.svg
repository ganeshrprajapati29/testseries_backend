<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" font-family="Arial, Helvetica, sans-serif"><rect width="520" height="160" fill="#ffffff"/><rect x="10" y="10" width="500" height="140" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="30" y="44" font-size="18" font-weight="bold" fill="#92400e">Worked solution</text><text x="30" y="80" font-size="17" fill="#0f172a">Area = πr²  ⇒  ratio = r₁² : r₂²</text><text x="30" y="110" font-size="17" fill="#0f172a">= 14² : 7² = 196 : 49</text><text x="30" y="140" font-size="17" fill="#0f172a">= 4 : 1</text></svg>